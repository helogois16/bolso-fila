name: Renovar token
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovar e guardar
        shell: bash
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN }}
        run: python3 renovar_token.py | gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"
